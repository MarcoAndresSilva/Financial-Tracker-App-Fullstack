<mat-sidenav-container class="sidenav-container">
  <!-- MENÚ LATERAL (SIDENAV) -->
  <mat-sidenav
    #sidenav
    [mode]="(isMobile$ | async) ? 'over' : 'side'"
    [(opened)]="isSidenavOpened"
    class="sidenav"
  >
    <div class="sidenav-header">
      <mat-icon class="brand-icon">savings</mat-icon>
      <h2 class="logo">FinTrack</h2>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="home"
        routerLinkActive="active-link"
        (click)="onNavLinkClick(sidenav)"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a
        mat-list-item
        routerLink="transactions"
        routerLinkActive="active-link"
        (click)="onNavLinkClick(sidenav)"
      >
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Transacciones</span>
      </a>
      <a
        mat-list-item
        routerLink="categories"
        routerLinkActive="active-link"
        (click)="onNavLinkClick(sidenav)"
      >
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Categorías</span>
      </a>
      <a
        mat-list-item
        routerLink="goals"
        routerLinkActive="active-link"
        (click)="onNavLinkClick(sidenav)"
      >
        <mat-icon matListItemIcon>flag</mat-icon>
        <span matListItemTitle>Metas de Ahorro</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <a mat-list-item (click)="logout()" style="cursor: pointer">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Cerrar Sesión</span>
      </a>
    </div>
  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content class="sidenav-content">
    <!-- BARRA SUPERIOR (TOOLBAR) -->
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="toolbar-brand">
        <mat-icon>savings</mat-icon>
        <span>FinTrack</span>
      </div>

      <span class="toolbar-spacer"></span>

      <!-- SALUDO AL USUARIO -->
      <div class="user-greeting" *ngIf="currentUser$ | async as user">
        <mat-icon>waving_hand</mat-icon>
        <span>¡Hola, {{ user.name || user.email }}!</span>
      </div>

      <!-- SELECTOR DE WALLET -->
      <ng-container *ngIf="activeWallet$ | async as activeWallet">
        <button mat-button [matMenuTriggerFor]="walletMenu" class="wallet-selector">
          <mat-icon>account_balance_wallet</mat-icon>
          <span>Cartera: {{ activeWallet.name }}</span>
          <mat-icon>arrow_drop_down</mat-icon>
        </button>
        <mat-menu #walletMenu="matMenu">
          <button
            mat-menu-item
            *ngFor="let wallet of userWallets$ | async"
            (click)="onSelectWallet(wallet)"
          >
            <mat-icon>{{
              wallet.id === activeWallet.id ? 'check_circle' : 'account_balance_wallet'
            }}</mat-icon>
            <span>{{ wallet.name }}</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="createSharedWallet()">
            <mat-icon>group_add</mat-icon>
            <span>Nueva wallet compartida</span>
          </button>
        </mat-menu>
      </ng-container>
    </mat-toolbar>

    <!-- El espacio donde se dibujarán nuestras páginas -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
