<h2 mat-dialog-title>Cambiar contraseña</h2>

<form [formGroup]="form" (ngSubmit)="onSave()">
  <div mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contraseña actual</mat-label>
      <input
        matInput
        formControlName="currentPassword"
        type="password"
        autocomplete="current-password"
        cdkFocusInitial
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contraseña nueva</mat-label>
      <input
        matInput
        formControlName="newPassword"
        type="password"
        autocomplete="new-password"
      />
      <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')"
        >Debe tener al menos 8 caracteres.</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Repite la contraseña nueva</mat-label>
      <input
        matInput
        formControlName="confirmPassword"
        type="password"
        autocomplete="new-password"
      />
      <mat-error
        *ngIf="form.get('confirmPassword')?.hasError('passwordMismatch')"
        >Las contraseñas no coinciden.</mat-error
      >
    </mat-form-field>

    <p class="error-message" *ngIf="errorMessage">
      <mat-icon>error_outline</mat-icon>{{ errorMessage }}
    </p>
    <p class="hint">Se cerrará la sesión en tus otros dispositivos.</p>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false">
      Cancelar
    </button>
    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="form.invalid || isSaving"
    >
      {{ isSaving ? "Guardando..." : "Guardar" }}
    </button>
  </div>
</form>
