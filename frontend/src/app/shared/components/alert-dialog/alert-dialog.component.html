<div class="alert-dialog" [ngClass]="data.type">
  <mat-icon class="alert-icon">
    {{ data.type === 'success' ? 'check_circle' : 'cancel' }}
  </mat-icon>

  <h2 mat-dialog-title>{{ data.title }}</h2>

  <div mat-dialog-content>
    <p>{{ data.message }}</p>
  </div>

  <div mat-dialog-actions align="center">
    <button
      mat-flat-button
      [color]="data.type === 'success' ? 'primary' : 'warn'"
      [mat-dialog-close]="true"
      cdkFocusInitial
    >
      Aceptar
    </button>
  </div>
</div>
