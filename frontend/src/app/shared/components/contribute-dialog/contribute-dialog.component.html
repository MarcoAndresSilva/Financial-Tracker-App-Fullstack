<h2 mat-dialog-title>Agregar ahorro a "{{ data.goalName }}"</h2>

<form [formGroup]="form" (ngSubmit)="onSave()">
  <div mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Monto a agregar</mat-label>
      <input matInput formControlName="amount" type="number" min="1" cdkFocusInitial />
    </mat-form-field>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">
      Cancelar
    </button>
    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="form.invalid"
    >
      Agregar
    </button>
  </div>
</form>
